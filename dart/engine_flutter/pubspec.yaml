name: engine_flutter
description: Native Flutter renderer and customizable kit runtime for MeldUI's A2UI catalog.
repository: https://github.com/MoringLab/meldui
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.35.7'
dependencies:
  flutter:
    sdk: flutter
  a2ui_core: 0.2.2
  json_schema_builder: 0.1.7
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_svg: 2.3.0
  markdown: ^7.3.1
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  assets:
    - assets/catalog.json
    - assets/kit-neutral.json
    - assets/kit-editorial.json
    - assets/kit-brand.json
