appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "함께 나누는 저녁"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "21000"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "만들기"
    direction: DOWN
- tapOn: "(?s)만들고 싶은 인터페이스.*"
- inputText: "Connection failure check"
- hideKeyboard
- tapOn: "만들기"
- extendedWaitUntil:
    visible: "(?s).*(Network request failed|연결을 확인|서버 연결|Failed to fetch|Failed to connect).*"
    timeout: 45000
- scrollUntilVisible:
    element:
      text: "21000"
    direction: UP
- assertVisible: "21000"
- takeScreenshot: artifacts/connection-recovery
