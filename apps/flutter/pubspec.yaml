name: engine_lab
description: Engine native Flutter verification app.
version: 0.1.0+1
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  engine_flutter:
    path: ../../dart/engine_flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/cases.json
    - assets/hybrid.json
    - assets/media.json

    - assets/advanced.json
    - assets/showcase.json

    - assets/custom.json
    - assets/custom-catalog.json
    - assets/service.json
